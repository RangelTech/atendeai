<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{NOME}}: painel</title>
<link rel="stylesheet" href="/s/estilo.css">
<link rel="stylesheet" href="/s/painel.css">
<style>:root{--marca:{{COR}}}</style>
</head>
<body>
<header class="topo"><div class="wrap">
  <a class="logo" href="/painel"><i>AI</i>{{NOME}}</a>
  <nav class="abas" role="tablist">
    <button role="tab" data-aba="conversas" aria-selected="true">Conversas <span class="badge" id="b-nao-lidas" hidden></span></button>
    <button role="tab" data-aba="regras">Regras</button>
    <button role="tab" data-aba="contas">Conta conectada</button>
    <button role="tab" data-aba="plano">Plano</button>
  </nav>
  <div style="display:flex;gap:8px"><button class="btn btn-ghost sm" data-senha>Minha senha</button><button class="btn btn-ghost sm" id="sair">Sair</button></div>
</div></header>

<main class="wrap painel">
  <div class="aviso" id="aviso" hidden></div>

  <!-- conversas -->
  <section data-painel="conversas">
    <div class="conv-grade">
      <aside class="conv-lista" id="conv-lista"><p class="vazio">Carregando…</p></aside>
      <div class="conv-detalhe" id="conv-detalhe"><p class="vazio">Escolha uma conversa.</p></div>
    </div>
  </section>

  <!-- regras -->
  <section data-painel="regras" hidden>
    <div class="duas">
      <div class="cartao">
        <div class="cab-cartao"><h3>Ensinar conversando</h3><span class="dim" id="sk-prog">0/8 assuntos</span></div>
        <div class="progresso"><span id="sk-barra"></span></div>
        <div class="chat" id="sk-chat"></div>
        <form class="linha" id="sk-form"><input id="sk-txt" placeholder="Responda aqui" autocomplete="off"><button class="btn btn-pri" aria-label="Enviar">Enviar</button></form>
      </div>
      <div class="cartao">
        <div class="cab-cartao"><h3>Regras do atendente</h3><button class="btn btn-pri sm" id="sk-salvar">Salvar</button></div>
        <label for="sk-texto">O que a IA sabe e como responde</label>
        <textarea id="sk-texto" class="alta" placeholder="A conversa ao lado escreve aqui. Você também pode escrever à mão."></textarea>
        <label for="sk-palavras">Palavras que chamam você (separe por vírgula)</label>
        <input id="sk-palavras" placeholder="atendente, humano, reclamação, cancelar">
        <div class="linha3">
          <div><label for="sk-ini">Abre às</label><input id="sk-ini" type="time"></div>
          <div><label for="sk-fim">Fecha às</label><input id="sk-fim" type="time"></div>
          <div><label>Dias</label><div class="dias" id="sk-dias"></div></div>
        </div>
        <p class="dim" style="font-size:13px;margin-top:6px">Sem horário marcado, a IA atende a qualquer hora.</p>
        <label for="sk-fora">Mensagem fora do horário</label>
        <input id="sk-fora" placeholder="Oi! Agora estamos fora do horário. Amanhã às 8h a gente responde.">
        <div class="msg" id="sk-msg" role="status"></div>
      </div>
    </div>
    <div class="duas" style="margin-top:16px">
      <div class="cartao">
        <h3>Testar antes de ligar</h3>
        <p class="dim">Escreva como se fosse o cliente. Nada é enviado.</p>
        <div class="chat curto" id="ts-chat"></div>
        <form class="linha" id="ts-form"><input id="ts-txt" placeholder="Ex.: quanto custa a entrega?" autocomplete="off"><button class="btn btn-sec">Testar</button></form>
      </div>
      <div class="cartao">
        <h3>Versões</h3>
        <div id="sk-versoes" class="versoes"><p class="vazio">Nenhuma versão salva ainda.</p></div>
      </div>
    </div>
  </section>

  <!-- contas -->
  <section data-painel="contas" hidden>
    <div class="cartao">
      <div class="cab-cartao"><h3>Contas do {{REDE}}</h3><button class="btn btn-pri sm" id="nova-conta">Conectar conta</button></div>
      <div id="lista-contas"><p class="vazio">Carregando…</p></div>
    </div>
  </section>

  <!-- plano -->
  <section data-painel="plano" hidden>
    <div class="cartao" id="meu-plano"></div>
    <div class="planos" id="lista-planos" style="margin-top:16px"></div>
  </section>
</main>

<div class="modal" id="m-conectar" hidden role="dialog" aria-modal="true" aria-labelledby="mc-tit">
  <div class="caixa"><button class="x" data-fechar aria-label="Fechar">×</button><div id="mc-corpo"></div></div>
</div>

<script>window.MARCA = {{MARCA_JSON}}</script>
<script src="/s/login.js"></script>
<script src="/s/qrcode.js"></script>
<script src="/s/painel.js"></script>
</body>
</html>
